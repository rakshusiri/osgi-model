name: OSGi Maven build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build every product or only changed products and their dependents
        type: choice
        options:
          - full
          - changed
        default: full
      base_ref:
        description: Git ref to compare against when build mode is changed
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build OSGi products
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: osgi-workshop/pom.xml

      - name: Select build scenario
        id: scenario
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.build_mode }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ inputs.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=changed" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=changed" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Maven and OSGi dependency graphs
        id: plan
        run: |
          python3 osgi-workshop/scripts/build_pipeline.py \
            --mode "${{ steps.scenario.outputs.mode }}" \
            --base "${{ steps.scenario.outputs.base }}"

      - name: Test dependency planner
        run: python3 -m unittest discover -s osgi-workshop/scripts -p 'test_*.py'

      - name: Build selected reactor projects
        if: steps.plan.outputs.build_required == 'true' && steps.scenario.outputs.mode == 'changed'
        run: |
          mvn --batch-mode --no-transfer-progress \
            --file osgi-workshop/pom.xml \
            --projects "${{ steps.plan.outputs.maven_projects }}" \
            --also-make \
            verify

      - name: Build all reactor projects
        if: steps.plan.outputs.build_required == 'true' && steps.scenario.outputs.mode == 'full'
        run: |
          mvn --batch-mode --no-transfer-progress \
            --file osgi-workshop/pom.xml \
            verify

      - name: Upload bundle and feature JARs
        if: steps.plan.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-jars
          path: osgi-workshop/*/target/.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload dependency graph reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-dependency-graphs
          path: |
            osgi-workshop/build-reports/dependency-graph.json
            osgi-workshop/build-reports/dependency-graph-full.mmd
            osgi-workshop/build-reports/dependency-graph-changed.mmd
          if-no-files-found: error
          retention-days: 30
