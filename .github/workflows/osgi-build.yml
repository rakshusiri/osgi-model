
name: OSGi Maven build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build all products or only changed products and their dependents
        type: choice
        options:
          - full
          - changed
        default: full
      base_ref:
        description: Git ref to compare against in changed mode
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build OSGi products
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Select build scenario
        id: scenario
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_MODE: ${{ inputs.build_mode }}
          BASE_REF: ${{ inputs.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=${BUILD_MODE:-full}" >> "$GITHUB_OUTPUT"
            echo "base=${BASE_REF:-main}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "mode=changed" >> "$GITHUB_OUTPUT"
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "mode=changed" >> "$GITHUB_OUTPUT"
            echo "base=$PUSH_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Maven and OSGi dependency graphs
        id: plan
        env:
          BUILD_MODE: ${{ steps.scenario.outputs.mode }}
          BASE_REF: ${{ steps.scenario.outputs.base }}
        run: |
          python3 scripts/build_pipeline.py \
            --mode "$BUILD_MODE" \
            --base "$BASE_REF"

      - name: Test dependency planner
        run: |
          python3 -m unittest discover \
            -s scripts \
            -p 'test_*.py'

      - name: Build selected reactor projects
        if: steps.plan.outputs.build_required == 'true' && steps.scenario.outputs.mode == 'changed'
        run: |
          mvn --batch-mode --no-transfer-progress \
            --file pom.xml \
            --projects "${{ steps.plan.outputs.maven_projects }}" \
            --also-make \
            verify

      - name: Build all reactor projects
        if: steps.plan.outputs.build_required == 'true' && steps.scenario.outputs.mode == 'full'
        run: |
          mvn --batch-mode --no-transfer-progress \
            --file pom.xml \
            verify

      - name: Upload bundle and feature JARs
        if: steps.plan.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-jars
          path: '**/target/*.jar'
          if-no-files-found: error
          retention-days: 30

      - name: Upload dependency graph reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northwind-oms-dependency-graphs
          path: |
            build-reports/dependency-graph.json
            build-reports/dependency-graph-full.mmd
            build-reports/dependency-graph-changed.mmd
          if-no-files-found: warn
          retention-days: 30
